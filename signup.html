<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | KROMA Academy</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('kroma-theme') || 'dark');
    document.documentElement.setAttribute('dir', localStorage.getItem('kroma-dir') || 'ltr');
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-page {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 1rem;
      background: var(--bg-primary);
      background-image: var(--gradient-mesh);
      position: relative;
      overflow-x: hidden;
    }
    .auth-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      pointer-events: none;
      opacity: 0.42;
    }
    .auth-orb-1 { width: 320px; height: 320px; background: var(--brand-purple); top: -80px; right: -80px; }
    .auth-orb-2 { width: 290px; height: 290px; background: var(--brand-orange); bottom: -90px; left: -80px; }
    .auth-card {
      width: 100%;
      max-width: 500px;
      padding: 1.75rem 1.85rem;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(22px);
    }
    .auth-brand-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.15rem;
    }
    .signup-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.25rem;
    }
    .signup-grid .form-group { margin-bottom: 0.45rem; }
    .password-wrap { position: relative; }
    .password-wrap .form-control { padding-right: 2.7rem; }
    .eye-btn {
      position: absolute;
      right: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      padding: 0.2rem;
    }
    .eye-btn:hover { color: var(--text-primary); }
    [dir="rtl"] .password-wrap .form-control { padding-right: 1.05rem; padding-left: 2.7rem; }
    [dir="rtl"] .eye-btn { right: auto; left: 0.7rem; }
    .auth-top-controls {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    [dir="rtl"] .auth-top-controls { right: auto; left: 1.25rem; }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0;
      color: var(--text-muted);
      font-size: 0.82rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }
    .social-auth-row {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    .social-auth-btn {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--bg-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s var(--transition-smooth), border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }
    .social-auth-btn.google:hover { transform: translateY(-4px) rotate(-5deg); border-color: #EA4335; box-shadow: 0 10px 24px rgba(234,67,53,0.28); background: rgba(234,67,53,0.12); }
    .social-auth-btn.facebook:hover { transform: translateY(-4px) scale(1.08); border-color: #1877F2; box-shadow: 0 10px 24px rgba(24,119,242,0.3); background: rgba(24,119,242,0.14); }
    .social-auth-btn.apple:hover { transform: translateY(-4px) rotate(5deg); border-color: var(--text-primary); box-shadow: 0 10px 24px rgba(168,85,247,0.25); background: rgba(255,255,255,0.12); }
    @media (max-width: 560px) {
      .auth-card { padding: 1.45rem 1.2rem; }
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <div class="auth-top-controls">
      <button type="button" class="theme-toggle dir-toggle" data-dir-toggle aria-label="Toggle RTL and LTR Direction" title="Switch to RTL">
        <span data-dir-icon></span>
      </button>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle Light and Dark Mode" title="Switch Theme">
        <span data-theme-icon></span>
      </button>
    </div>
    <div class="auth-orb auth-orb-1 float-slow"></div>
    <div class="auth-orb auth-orb-2 float-delayed"></div>

    <section class="glass-card auth-card" aria-label="Student Registration">
      <div class="auth-brand-top">
        <a href="index.html" class="brand-logo" title="Back to Home">
          <img src="assets/images/logo.svg" alt="KROMA Logo" width="40" height="40">
          <span>KROMA</span>
        </a>
        <h1 style="font-size:1.45rem;margin-top:0.65rem;">Start Your Creative Journey</h1>
        <p style="color:var(--text-muted);font-size:0.88rem;margin-top:0.15rem;">Create your student admission account</p>
      </div>

      <form id="signupForm" novalidate>
        <div class="form-group" style="margin-bottom:0.65rem;">
          <label for="signupName" class="form-label">Full Name</label>
          <input type="text" id="signupName" class="form-control" placeholder="Alex Mercer" required>
          <span class="form-error" id="signupNameErr"></span>
        </div>

        <div class="signup-grid">
          <div class="form-group">
            <label for="signupEmail" class="form-label">Email Address</label>
            <input type="email" id="signupEmail" class="form-control" placeholder="alex@example.com" required>
            <span class="form-error" id="signupEmailErr"></span>
          </div>
          <div class="form-group">
            <label for="signupPhone" class="form-label">Phone Number</label>
            <input type="tel" id="signupPhone" class="form-control" placeholder="+1 555 019 4820" required>
            <span class="form-error" id="signupPhoneErr"></span>
          </div>
        </div>

        <div class="signup-grid">
          <div class="form-group">
            <label for="signupPassword" class="form-label">Password</label>
            <div class="password-wrap">
              <input type="password" id="signupPassword" class="form-control" placeholder="Min 6 chars" required>
              <button type="button" class="eye-btn" data-toggle-password="signupPassword" aria-label="Show password">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <span class="form-error" id="signupPasswordErr"></span>
          </div>

          <div class="form-group">
            <label for="signupConfirmPassword" class="form-label">Confirm Password</label>
            <div class="password-wrap">
              <input type="password" id="signupConfirmPassword" class="form-control" placeholder="Repeat password" required>
              <button type="button" class="eye-btn" data-toggle-password="signupConfirmPassword" aria-label="Show confirm password">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <span class="form-error" id="signupConfirmErr"></span>
          </div>
        </div>

        <div style="margin:0.5rem 0 0.9rem;">
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;color:var(--text-secondary);cursor:pointer;">
            <input type="checkbox" id="signupTerms" style="accent-color:var(--brand-purple);">
            I agree to the Terms and Conditions &amp; Student Privacy Policy
          </label>
          <span class="form-error" id="signupTermsErr"></span>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
      </form>

      <div id="authToast" class="form-toast" role="status"></div>

      <div class="auth-divider">or sign up with</div>

      <div class="social-auth-row">
        <button type="button" class="social-auth-btn google" data-provider="Google" aria-label="Sign up with Google">
          <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/><path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.8s.2-2 .4-2.8L1.6 6.4C.6 8.4 0 10.6 0 12s.6 3.6 1.6 5.6l3.7-2.8z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 20.4 7.4 23 12 23z"/></svg>
        </button>
        <button type="button" class="social-auth-btn facebook" data-provider="Facebook" aria-label="Sign up with Facebook">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M22.675 0H1.325C.593 0 0 .593 0 1.325v21.351C0 23.407.593 24 1.325 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116c.73 0 1.323-.593 1.323-1.325V1.325C24 .593 23.407 0 22.675 0z"/></svg>
        </button>
        <button type="button" class="social-auth-btn apple" data-provider="Apple" aria-label="Sign up with Apple">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        </button>
      </div>

      <p style="text-align:center;margin-top:1rem;font-size:0.88rem;color:var(--text-secondary);">
        Already Have an Account? <a href="login.html" style="color:var(--brand-purple-light);font-weight:700;">Login</a>
      </p>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
