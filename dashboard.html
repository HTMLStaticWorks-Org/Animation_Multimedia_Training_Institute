<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | KROMA Academy</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('kroma-theme') || 'dark');</script>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    html, body {
      overflow-x: clip;
    }
    .dash-shell {
      display: flex;
      min-height: 100dvh;
      background: var(--bg-primary);
    }
    .dash-sidebar {
      width: 270px;
      flex-shrink: 0;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 1.15rem 1rem;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      height: 100vh;
      height: 100dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
      z-index: 100;
      transition: transform 0.35s var(--transition-smooth);
    }
    [dir="rtl"] .dash-sidebar {
      left: auto;
      right: 0;
      border-right: none;
      border-left: 1px solid var(--border-subtle);
    }
    .dash-nav {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-top: 1.15rem;
      flex: 1;
    }
    .dash-nav-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.65rem 0.95rem;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    [dir="rtl"] .dash-nav-btn {
      text-align: right;
    }
    .dash-nav-btn:hover {
      background: var(--bg-soft);
      color: var(--text-primary);
      transform: translateX(3px);
    }
    [dir="rtl"] .dash-nav-btn:hover {
      transform: translateX(-3px);
    }
    .dash-nav-btn.active {
      background: var(--gradient-brand);
      color: #FFFFFF;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
    }
    .dash-nav-btn.logout-btn {
      margin-top: auto;
      color: #EF4444;
    }
    .dash-nav-btn.logout-btn:hover {
      background: rgba(239, 68, 68, 0.12);
    }
    .dash-main {
      flex: 1;
      min-width: 0;
      margin-left: 270px;
      display: flex;
      flex-direction: column;
    }
    [dir="rtl"] .dash-main {
      margin-left: 0;
      margin-right: 270px;
    }
    .dash-topbar {
      min-height: 74px;
      padding: 0.65rem 1.75rem;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: fixed;
      top: 0;
      left: 270px;
      right: 0;
      z-index: 50;
    }
    [dir="rtl"] .dash-topbar {
      left: 0;
      right: 270px;
    }
    .dash-topbar-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      min-width: 0;
    }
    .dash-topbar-title-wrap {
      min-width: 0;
    }
    .dash-topbar-eyebrow {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--brand-orange);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dash-topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    .dash-profile-pill {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.35rem 0.75rem 0.35rem 0.4rem;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px solid var(--border-subtle);
    }
    .dash-content {
      padding: calc(74px + 1.75rem) 1.75rem 1.75rem;
      flex: 1;
    }
    .dash-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.15rem;
      margin-bottom: 1.5rem;
    }
    .dash-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .dash-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }
    .stat-card {
      padding: 1.25rem;
    }
    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: var(--bg-soft);
      overflow: hidden;
      margin-top: 0.6rem;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--gradient-brand);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      font-family: var(--font-mono);
      white-space: nowrap;
      line-height: 1.25;
    }
    .badge-purple { background: rgba(124, 58, 237, 0.18); color: var(--brand-purple-light); }
    .badge-orange { background: rgba(249, 115, 22, 0.18); color: var(--brand-orange); }
    .badge-lime { background: rgba(249, 115, 22, 0.18); color: var(--brand-orange); }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }
    .dash-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
    }
    .dash-table th, .dash-table td {
      padding: 0.9rem 1rem;
      text-align: left;
      vertical-align: middle;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.9rem;
    }
    .dash-table th {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .dash-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 90;
    }
    .dash-backdrop.open { display: block; }
    .dash-hamburger { display: none; }
    @media (max-width: 1120px) {
      .dash-grid-4 { grid-template-columns: repeat(2, 1fr); }
      .dash-grid-3 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 1024px) {
      .dash-sidebar {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-100%);
      }
      [dir="rtl"] .dash-sidebar {
        left: auto;
        right: 0;
        transform: translateX(100%);
      }
      .dash-sidebar.open,
      [dir="rtl"] .dash-sidebar.open { transform: translateX(0); }
      .dash-main,
      [dir="rtl"] .dash-main {
        margin-left: 0;
        margin-right: 0;
      }
      .dash-topbar,
      [dir="rtl"] .dash-topbar {
        left: 0;
        right: 0;
      }
      .dash-hamburger { display: inline-flex; }
    }
    @media (max-width: 960px) {
      .dash-grid-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .dash-grid-4, .dash-grid-3 { grid-template-columns: 1fr; }
      .dash-content { padding: calc(64px + 1.15rem) 1.15rem 1.15rem; }
      .dash-topbar {
        min-height: 64px;
        padding: 0.55rem 0.9rem;
        gap: 0.5rem;
      }
      .dash-topbar-left { gap: 0.6rem; }
      .dash-topbar-eyebrow { font-size: 0.64rem; }
      #dashPageTitle { font-size: 1.05rem !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dash-topbar-actions { gap: 0.4rem; }
      .dash-topbar-actions .theme-toggle { width: 36px; height: 36px; }
      .dash-hamburger { width: 38px; height: 38px; }
      .dash-profile-pill { padding: 0.2rem; }
      #topStudentName { display: none; }
    }
  </style>
</head>
<body>
  <div class="dash-shell">
    <div class="dash-backdrop" id="dashBackdrop"></div>

    <aside class="dash-sidebar" id="dashSidebar" aria-label="Student Dashboard Navigation">
      <a href="index.html" class="brand-logo" style="padding-left:0.5rem;">
        <img src="assets/images/logo.svg" alt="KROMA Logo" width="38" height="38">
        <span>KROMA</span>
      </a>

      <nav class="dash-nav" id="dashNav">
        <button class="dash-nav-btn active" data-view="overview">Overview</button>
        <button class="dash-nav-btn" data-view="courses">My Courses</button>
        <button class="dash-nav-btn" data-view="schedule">Batch Schedule</button>
        <button class="dash-nav-btn" data-view="assignments">Assignments</button>
        <button class="dash-nav-btn" data-view="submissions">Project Submissions</button>
        <button class="dash-nav-btn" data-view="portfolio">My Portfolio</button>
        <button class="dash-nav-btn" data-view="fees">Fee Details</button>
        <button class="dash-nav-btn" data-view="notifications">Notifications</button>
        <button class="dash-nav-btn" data-view="profile">Profile Settings</button>
        <button class="dash-nav-btn logout-btn" id="dashLogoutBtn">Logout</button>
      </nav>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <div class="dash-topbar-left">
          <button type="button" class="mobile-menu-btn dash-hamburger" id="dashMenuBtn" aria-label="Toggle Sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="dash-topbar-title-wrap">
            <span class="dash-topbar-eyebrow">Student Portal (Demo)</span>
            <h1 id="dashPageTitle" style="font-size:1.25rem;">Overview</h1>
          </div>
        </div>

        <div class="dash-topbar-actions">
          <button type="button" class="theme-toggle dir-toggle" id="dashDirBtn" data-dir-toggle aria-label="Toggle RTL and LTR Direction" title="Switch to RTL">
            <span data-dir-icon></span>
          </button>
          <button type="button" class="theme-toggle" id="dashThemeBtn" aria-label="Toggle Theme">
            <span data-theme-icon></span>
          </button>
          <div class="dash-profile-pill">
            <div id="topAvatar" style="width:32px;height:32px;border-radius:50%;background:var(--gradient-brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.85rem;">AM</div>
            <span id="topStudentName" style="font-size:0.88rem;font-weight:600;">Alex Mercer</span>
          </div>
        </div>
      </header>

      <main class="dash-content" id="dashboardView"></main>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
